name: CI - Builds and Deploy application to Droplet

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Write build env file
        run: printf '%s' "${{ secrets.BUILD_ENV }}" > .build_env

      - name: Build application image
        env:
          BUILDKIT_PROGRESS: plain
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runner
          push: false
          load: true
          tags: project-name:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          secret-files: |
            build_env=.build_env

      - name: Build migration image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: migrator
          push: false
          load: true
          tags: project-name:migrator
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          secret-files: |
            build_env=.build_env

      - name: Save images to tar
        run: |
          docker save \
            --output image.tar \
            project-name:latest \
            project-name:migrator
          chmod 644 image.tar
          ls -lh image.tar

      - name: Remove build env file
        if: always()
        run: rm -f .build_env

      - name: Upload deploy bundle
        uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle
          path: |
            image.tar
            deploy.sh
          retention-days: 1
          compression-level: 0

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Download deploy bundle
        uses: actions/download-artifact@v4
        with:
          name: deploy-bundle

      - name: Prepare remote deployment directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            mkdir -p /tmp/deploy
            rm -f /tmp/deploy/image.tar /tmp/deploy/deploy.sh

      - name: Copy image and deploy script to Droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          source: "image.tar,deploy.sh"
          target: /tmp/deploy
          overwrite: true

      - name: Run remote deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            cd /tmp/deploy
            chmod +x deploy.sh
            ./deploy.sh
            docker image prune -f
