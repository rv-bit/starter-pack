name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Write build env file
        run: printf '%s' "${{ secrets.BUILD_ENV }}" > .build_env

      - name: Build application image
        env:
          BUILDKIT_PROGRESS: plain
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runner
          push: false
          load: true
          tags: app-name:latest
          cache-from: type=gha,source=runner
          cache-to: type=gha,mode=max,source=runner
          provenance: false
          secret-files: |
            build_env=.build_env

      - name: Build migration image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: migrator
          push: false
          load: true
          tags: app-name:migrator
          cache-from: type=gha,source=migrator
          cache-to: type=gha,mode=max,source=migrator
          provenance: false
          secret-files: |
            build_env=.build_env

      - name: Save images to tar
        run: |
          docker save \
            --output image.tar \
            app-name:latest \
            app-name:migrator
          chmod 644 image.tar
          ls -lh image.tar

      - name: Remove build env file
        if: always()
        run: rm -f .build_env

      - name: Upload deploy bundle
        uses: actions/upload-artifact@v7
        with:
          name: deploy-bundle
          path: |
            image.tar
            deploy.sh
          retention-days: 1
          compression-level: 0

  deploy:
    environment: production
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download deploy bundle
        uses: actions/download-artifact@v8
        with:
          name: deploy-bundle

      - name: Prepare remote deployment directory
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          # Must match the server's negotiated ECDSA host key.
          fingerprint: ${{ secrets.DO_HOST_FINGERPRINT }}
          script: |
            set -e
            mkdir -p /tmp/deploy
            rm -f /tmp/deploy/image.tar /tmp/deploy/deploy.sh

      - name: Copy image and deploy script to Droplet
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          # Must match the server's negotiated ECDSA host key.
          fingerprint: ${{ secrets.DO_HOST_FINGERPRINT }}
          source: "image.tar,deploy.sh"
          target: /tmp/deploy
          overwrite: true

      - name: Run remote deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          # Must match the server's negotiated ECDSA host key.
          fingerprint: ${{ secrets.DO_HOST_FINGERPRINT }}
          script: |
            set -e
            cd /tmp/deploy
            chmod +x deploy.sh
            ./deploy.sh
            docker image prune -f
